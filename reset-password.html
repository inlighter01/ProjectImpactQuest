<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password – Impact Quest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0A08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <div class="auth-card glass-card">
      <h1 class="section__title">Choose a new password</h1>
      <p class="subtitle">Make sure it’s strong and memorable.</p>

      <form id="reset-form" class="auth-form">
        <div class="input-group">
          <label for="password">New Password</label>
          <input type="password" id="password" class="input" placeholder="At least 8 characters" required minlength="8">
          <div class="password-strength">
            <div class="password-strength__bar" id="strength-bar"></div>
          </div>
        </div>
        <div class="input-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="input" placeholder="Re-enter password" required>
        </div>
        <button type="submit" class="btn btn--primary">Update Password</button>
        <p id="reset-error" class="validation-message error hidden"></p>
        <p id="reset-success" class="validation-message success hidden"></p>
      </form>
      <div class="auth-footer">
        <a href="login.html">Back to sign in</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const strengthBar = document.getElementById('strength-bar');

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let strength = 0;
      if (val.length >= 8) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;
      strengthBar.className = 'password-strength__bar';
      if (strength <= 1) strengthBar.classList.add('strength-weak');
      else if (strength === 2) strengthBar.classList.add('strength-fair');
      else if (strength === 3) strengthBar.classList.add('strength-good');
      else strengthBar.classList.add('strength-strong');
    });

    const form = document.getElementById('reset-form');
    const errorEl = document.getElementById('reset-error');
    const successEl = document.getElementById('reset-success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return;
      }

      const { data, error } = await updatePassword(password);
      if (error) {
        errorEl.textContent = error.message || 'Password update failed. The link may have expired.';
        errorEl.classList.remove('hidden');
      } else {
        successEl.textContent = 'Password updated successfully! Redirecting to sign in...';
        successEl.classList.remove('hidden');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      }
    });
  </script>
  <script src="animations.js"></script>
</body>
</html>
