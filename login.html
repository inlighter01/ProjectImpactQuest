<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back – Impact Quest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e27">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <div class="auth-card glass-card">
      <h1 class="section__title">Welcome back</h1>
      <p class="subtitle">Your community is waiting for you.</p>

      <form id="login-form" class="auth-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input" placeholder="Your password" required>
        </div>
        <div class="input-group">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
        </div>
        <button type="submit" class="btn btn--primary">Sign In</button>
        <p id="login-error" class="validation-message error hidden"></p>
      </form>
      <div class="auth-footer">
        <a href="forgot-password.html">Forgot password?</a><br>
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      const { data, error } = await loginUser(email, password);
      if (error) {
        errorEl.textContent = 'We couldn’t sign you in. Please check your email and password and try again.';
        errorEl.classList.remove('hidden');
      } else {
        // Optionally set session persistence (Supabase default is local/session based on rememberMe)
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = next ? decodeURIComponent(next) : 'profile.html';
      }
    });
  </script>
</body>
</html>
