<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back – Impact Quest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0A08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div id="ember-field" aria-hidden="true"></div>
  <main class="auth-container">
    <div class="spirit-orb-wrap">
      <div class="spirit-orb" tabindex="0" role="img" aria-label="Ember, your Impact Quest guide">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="orbHaloGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#E8C55A" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#A83240" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="orbCoreGrad" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#FCEFC7"/>
              <stop offset="55%" stop-color="#E8C55A"/>
              <stop offset="100%" stop-color="#A83240"/>
            </radialGradient>
          </defs>
          <circle class="spirit-orb__halo" cx="50" cy="50" r="46" fill="url(#orbHaloGrad)"/>
          <circle class="spirit-orb__ring" cx="50" cy="50" r="40" fill="none" stroke="#C9A227" stroke-width="1.2" stroke-dasharray="3 8" opacity="0.6"/>
          <circle class="spirit-orb__sparkle" cx="18" cy="34" r="2" fill="#E8C55A"/>
          <circle class="spirit-orb__sparkle" cx="82" cy="40" r="1.6" fill="#E8C55A"/>
          <circle class="spirit-orb__sparkle" cx="22" cy="70" r="1.6" fill="#E8C55A"/>
          <circle class="spirit-orb__core" cx="50" cy="50" r="22" fill="url(#orbCoreGrad)"/>
        </svg>
      </div>
      <p class="guide-speech spirit-orb__greeting">Hi! Welcome back. 👋</p>
    </div>
    <div class="auth-card glass-card">
      <h1 class="section__title">Welcome back</h1>
      <p class="subtitle">Your community is waiting for you.</p>

      <form id="login-form" class="auth-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="input" placeholder="Your password" required>
        </div>
        <div class="input-group">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
        </div>
        <button type="submit" class="btn btn--primary">Sign In</button>
        <p id="login-error" class="validation-message error hidden"></p>
      </form>
      <div class="auth-footer">
        <a href="forgot-password.html">Forgot password?</a><br>
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      const { data, error } = await loginUser(email, password);
      if (error) {
        errorEl.textContent = 'We couldn’t sign you in. Please check your email and password and try again.';
        errorEl.classList.remove('hidden');
      } else {
        // Optionally set session persistence (Supabase default is local/session based on rememberMe)
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = next ? decodeURIComponent(next) : 'profile.html';
      }
    });
  </script>
  <script src="animations.js"></script>
</body>
</html>
