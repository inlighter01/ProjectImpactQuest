<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Settings – Impact Quest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0A08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-container" style="max-width: 600px;">
    <div class="auth-card glass-card">
      <a href="profile.html" class="auth-back">← Back to Profile</a>
      <h1 class="section__title">Privacy Settings</h1>
      <p class="subtitle">Control what information is visible to other community members.</p>

      <div class="privacy-options">
        <div class="privacy-option">
          <span>Profile Visibility</span>
          <label class="toggle-label">
            <input type="checkbox" class="toggle" checked disabled> (Coming soon)
          </label>
        </div>
        <div class="privacy-option">
          <span>Bio Visibility</span>
          <label class="toggle-label">
            <input type="checkbox" class="toggle" checked disabled>
          </label>
        </div>
        <div class="privacy-option">
          <span>Skills Visibility</span>
          <label class="toggle-label">
            <input type="checkbox" class="toggle" checked disabled>
          </label>
        </div>
        <div class="privacy-option">
          <span>Interests Visibility</span>
          <label class="toggle-label">
            <input type="checkbox" class="toggle" checked disabled>
          </label>
        </div>
        <div class="privacy-option">
          <span>City Visibility</span>
          <label class="toggle-label">
            <input type="checkbox" class="toggle" checked disabled>
          </label>
        </div>
        <div class="privacy-option">
          <span>Avatar Visibility</span>
          <label class="toggle-label">
            <input type="checkbox" class="toggle" checked disabled>
          </label>
        </div>
      </div>
      <p class="caption" style="margin-top: var(--space-sm);">Fine-grained privacy controls will be available in a future update.</p>
    </div>
  </main>
  <script src="animations.js"></script>
</body>
</html>
