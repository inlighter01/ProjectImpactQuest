<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password – Impact Quest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0A08">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <div class="auth-card glass-card">
      <h1 class="section__title">Forgot your password?</h1>
      <p class="subtitle">Enter your email and we’ll send you a reset link.</p>

      <form id="forgot-form" class="auth-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="input" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn--primary">Send Reset Link</button>
        <p id="forgot-error" class="validation-message error hidden"></p>
        <p id="forgot-success" class="validation-message success hidden"></p>
      </form>
      <div class="auth-footer">
        <a href="login.html">Back to sign in</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const errorEl = document.getElementById('forgot-error');
    const successEl = document.getElementById('forgot-success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      const email = document.getElementById('email').value;
      const { data, error } = await sendPasswordReset(email);
      if (error) {
        errorEl.textContent = error.message || 'Unable to send reset email. Please try again.';
        errorEl.classList.remove('hidden');
      } else {
        successEl.textContent = 'If that email is registered, you’ll receive a reset link shortly.';
        successEl.classList.remove('hidden');
        form.reset();
      }
    });
  </script>
</body>
</html>
