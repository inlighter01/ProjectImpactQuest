<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Verification – Impact Quest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e27">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-container" style="max-width: 600px;">
    <div class="auth-card glass-card">
      <a href="profile.html" class="auth-back">← Back to Profile</a>
      <h1 class="section__title">Community Verification</h1>
      <div id="verification-status-display">
        <!-- Dynamic content based on status -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script>
    if (!isConfigured) window.location.href = 'index.html';

    async function loadVerificationPage() {
      const container = document.getElementById('verification-status-display');
      try {
        const user = await getCurrentUser();
        if (!user) { window.location.href = 'login.html'; return; }
        const profile = await getOrCreateProfile(user);
        const status = profile.verification_status || 'not_submitted';

        if (status === 'not_submitted') {
          container.innerHTML = `
            <p class="subtitle">Strengthen your identity and unlock more quests by verifying your account.</p>
            <form id="verify-form" class="auth-form">
              <div class="input-group">
                <label for="full-name">Full Legal Name</label>
                <input type="text" id="full-name" class="input" placeholder="As it appears on your ID" required>
              </div>
              <div class="input-group">
                <label for="id-type">ID Type</label>
                <select id="id-type" class="dropdown">
                  <option>Passport</option>
                  <option>Driver's License</option>
                  <option>National ID</option>
                </select>
              </div>
              <button type="submit" class="btn btn--primary">Submit Verification Request</button>
              <p class="validation-message success hidden" id="verify-success"></p>
            </form>
          `;

          document.getElementById('verify-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Placeholder: set status to pending
            await updateProfile(user.id, { verification_status: 'pending' });
            document.getElementById('verify-success').textContent = 'Your verification request has been submitted!';
            document.getElementById('verify-success').classList.remove('hidden');
            setTimeout(() => { window.location.reload(); }, 1500);
          });
        } else if (status === 'pending') {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">⏳</div>
              <h3>Verification Pending</h3>
              <p>Your request is being reviewed by our community team. This usually takes 1-3 days.</p>
            </div>
          `;
        } else if (status === 'approved') {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">✅</div>
              <h3>Verification Approved</h3>
              <p>Congratulations! Your identity has been verified.</p>
            </div>
          `;
        } else if (status === 'rejected') {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">❌</div>
              <h3>Verification Rejected</h3>
              <p>Unfortunately, your verification could not be completed. Please contact support for more information.</p>
              <button class="btn btn--primary" onclick="retryVerification()">Try Again</button>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `<p class="validation-message error">Unable to load verification status.</p>`;
      }
    }

    async function retryVerification() {
      const user = await getCurrentUser();
      if (user) {
        await updateProfile(user.id, { verification_status: 'not_submitted' });
        window.location.reload();
      }
    }

    loadVerificationPage();
  </script>
</body>
</html>
